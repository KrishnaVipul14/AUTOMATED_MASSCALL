services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: commhub
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: commhub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
