# 100% Free Render Blueprint (No paid worker service)
services:
  - type: web
    name: commhub-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:packages && npm run build -w @commhub/worker && npm run build -w @commhub/api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROVIDER_MODE
        value: MOCK
      - key: EMBED_WORKER
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: commhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: commhub-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true

  - type: keyvalue
    name: commhub-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: commhub-db
    plan: free
    databaseName: commhub
    user: commhub
