services:
  - type: web
    name: commhub-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:packages && npm run build -w @commhub/api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROVIDER_MODE
        value: MOCK
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: commhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: commhub-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true

  - type: worker
    name: commhub-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:packages && npm run build -w @commhub/worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROVIDER_MODE
        value: MOCK
      - key: DATABASE_URL
        fromDatabase:
          name: commhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: commhub-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: commhub-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: commhub-api
          envVarKey: JWT_REFRESH_SECRET
      - key: WEBHOOK_SIGNING_SECRET
        fromService:
          type: web
          name: commhub-api
          envVarKey: WEBHOOK_SIGNING_SECRET

  - type: redis
    name: commhub-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: commhub-db
    plan: free
    databaseName: commhub
    user: commhub
